services:
  db:
    image: postgres:16-bookworm
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic", "-c", "log_statement=none", "-c", "log_min_duration_statement=-1"]
    environment:
      POSTGRES_USER: travelcrm
      POSTGRES_DB: travelcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelcrm -d travelcrm"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://travelcrm:${POSTGRES_PASSWORD:?Run scripts/init_env.py first}@db:5432/travelcrm
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run scripts/init_env.py first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      BACKEND_PORT: 8000
      BACKEND_HOST: 0.0.0.0
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      PAYMENT_STUB_URL: http://stubs:8010
      PAYMENT_STUB_KEY: ${PAYMENT_STUB_KEY:?Run scripts/init_env.py --add-payment-settings}
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-1}
      PAYMENT_RECONCILIATION_ENABLED: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      stubs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  stubs:
    build:
      context: .
      dockerfile: stubs/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://travelcrm:${POSTGRES_PASSWORD:?Run scripts/init_env.py first}@db:5432/travelcrm
      PAYMENT_STUB_KEY: ${PAYMENT_STUB_KEY:?Run scripts/init_env.py --add-payment-settings}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      STUB_SCHEMA: payment_stub
      PAYMENT_CALLBACK_URL: http://backend:8000/internal/payment-events
      STUB_REFUND_OUTCOME: ${STUB_REFUND_OUTCOME:-succeeded}
    ports:
      - "127.0.0.1:${PAYMENT_STUB_PORT:-8010}:8010"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
