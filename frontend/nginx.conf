map $request_uri $travelcrm_loggable {
    default 1;
    ~^/(api/)?public/ 0;
}

map $request_uri $travelcrm_referrer_policy {
    default same-origin;
    ~^/(api/)?public/ no-referrer;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy $travelcrm_referrer_policy always;
    access_log /dev/stdout combined if=$travelcrm_loggable;

    # Адрес backend определяется при запросе, поэтому nginx стартует и без запущенного бэкенда.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Тот же адрес /api, что проксирует Vite в разработке: cookie обновления остаётся на одном origin.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/public/ {
        access_log off;
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Файлы с хешем в имени не меняются: кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /public/ {
        access_log off;
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }

    # Все остальные адреса отдаёт приложение с клиентской маршрутизацией.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
